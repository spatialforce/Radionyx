      Initial loading screen.
      This appears immediately while React loads,
      preventing a blank white screen.

    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #1a1a18;
      }

      #root {
        min-height: 100vh;
      }

      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #1a1a18;
        color: #f1f1ec;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      /* Subtle diagonal hatch pattern */
      #initial-loader::before {
        content: "";
        position: absolute;
        inset: -50%;
        background:
          repeating-linear-gradient(
            135deg,
            transparent 0,
            transparent 30px,
            rgba(241, 241, 236, 0.035) 30px,
            rgba(241, 241, 236, 0.035) 31px
          );
        transform: rotate(-3deg);
        pointer-events: none;
      }

      /* Subtle dot field */
      #initial-loader::after {
        content: "";
        position: absolute;
        right: -80px;
        bottom: -100px;
        width: 360px;
        height: 360px;
        opacity: 0.18;
        background-image:
          radial-gradient(
            rgba(241, 241, 236, 0.55) 1px,
            transparent 1px
          );
        background-size: 12px 12px;
        mask-image:
          linear-gradient(
            135deg,
            transparent 10%,
            black 70%
          );
        -webkit-mask-image:
          linear-gradient(
            135deg,
            transparent 10%,
            black 70%
          );
        pointer-events: none;
      }

      .loader-content {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 18px;
        animation: loaderFadeIn 0.45s ease-out both;
      }

      .loader-mark {
        position: relative;
        width: 34px;
        height: 34px;
        flex: 0 0 34px;
        overflow: hidden;
        border: 1px solid rgba(241, 241, 236, 0.35);
      }

      .loader-mark::before,
      .loader-mark::after {
        content: "";
        position: absolute;
        background: #2dbb6f;
      }

      .loader-mark::before {
        left: 7px;
        top: -8px;
        width: 7px;
        height: 50px;
        transform: rotate(38deg);
      }

      .loader-mark::after {
        right: 7px;
        top: -8px;
        width: 2px;
        height: 50px;
        transform: rotate(38deg);
        opacity: 0.55;
      }

      .loader-name {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      .loader-line {
        position: absolute;
        left: 50%;
        bottom: 30px;
        width: 70px;
        height: 1px;
        overflow: hidden;
        background: rgba(241, 241, 236, 0.12);
        transform: translateX(-50%);
      }

      .loader-line::after {
        content: "";
        position: absolute;
        left: -35px;
        top: 0;
        width: 35px;
        height: 1px;
        background: #2dbb6f;
        animation: loaderLine 0.9s ease-in-out infinite;
      }

      @keyframes loaderFadeIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes loaderLine {
        0% {
          left: -35px;
        }

        100% {
          left: 70px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader-content {
          animation: none;
        }

        .loader-line::after {
          animation: none;
          left: 0;
          width: 35px;
        }
      }
    </style>
